server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: be-material

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # Cấu hình kết nối MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/material_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Cấu hình CORS & JWT Token & OnlyOffice
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000        # 24 giờ
    refresh-expiration-ms: 604800000 # 7 ngày
  storage:
    document-path: ./storage/documents/
  onlyoffice:
    document-server-url: http://localhost:8088/
    backend-host-for-docker: http://host.docker.internal:8080
    backend-host-for-client: http://localhost:8080

# Cấu hình Swagger OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha